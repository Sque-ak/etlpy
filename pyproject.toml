[build-system]
requires = ["setuptools>=77"]        
build-backend = "setuptools.build_meta"

[project]
name = "etlpy-tools"
version = "1.1.1"
description = "A composable, async, Polars-native ETL toolkit"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vladimir Novotorzhin", email = "include.dos.h@yandex.ru" }]
keywords = ["etl", "polars", "clickhouse", "airflow", "data-pipeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "polars>=1.41.2",
    "polars-hash>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/Sque-ak/etlpy"
Repository = "https://github.com/Sque-ak/etlpy"
Issues = "https://github.com/Sque-ak/etlpy/issues"

[project.optional-dependencies]
extractor = [
    "httpx>=0.28.1",
    "etlpy-tools[loader]",
]
transformer = [
    "polars>=1.41.2",
    "pyarrow>=15.0.0",
]
loader = [
    "pyarrow>=15.0.0"
]
test = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "testcontainers[clickhouse]>=4.14.2", 
    "clickhouse-connect>=1.3.0",
    "pymongo>=4.9",
    "aioodbc>=0.5.0",
    "asyncpg>=0.31.0",
    "etlpy-tools[all]",
]

all = ["etlpy-tools[extractor,transformer,loader]"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["etl*"]
exclude = ["*.tests", "*.tests.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["src"]
markers = ["integration: needs external services"]

[tool.coverage.run]
source = ["etl"]