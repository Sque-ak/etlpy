[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "etlpy"
version = "1.2.0"
description = "A flexible set of utilities to extract, transform, and load data in your own ETL service"
dependencies = [
    "polars>=1.41.2", 
    "schedule>=1.2.2",
]

[project.optional-dependencies]
extractor = [
    "httpx>=0.28.1",
    "etlpy[loader]",
]
transformer = [
    "polars>=1.41.2",
    "pyarrow>=15.0.0",
    "polars-hash>=0.6.0",
]
loader = [
    "pyarrow>=15.0.0"
]
test = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "testcontainers[clickhouse]>=4.14.2", 
    "clickhouse-connect>=1.3.0"
]

all = ["etlpy[extractor,transformer,loader]"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["etl*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["src"]
markers = ["integration: needs external services (Docker/ClickHouse)"]

[tool.coverage.run]
source = ["etl"]